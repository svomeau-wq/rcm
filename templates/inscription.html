{% extends "base.html" %}
{% block body %}
<form method="post" action="{{ url_for('inscription') }}" class="auth-card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h1>Creer un compte</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input name="name" placeholder="Nom" required>
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Mot de passe (min 8)" required>
  <input name="confirm" type="password" placeholder="Confirmer le mot de passe" required>
  <button type="submit">S'inscrire</button>
  <p class="auth-alt">Deja un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
</form>
{% endblock %}
