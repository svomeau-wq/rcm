<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AR24 — Lettre Recommandée Électronique{% endblock %}</title>
<meta name="description" content="AR24 — envoyez vos lettres recommandées électroniques à valeur juridique. Horodatage certifié, preuve de distribution, conservation 10 ans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563EB' d='M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('login') }}" class="topbar-brand" data-testid="topbar-brand-logo">
    <svg width="28" height="24" viewBox="0 0 28 24" fill="none" aria-hidden="true">
  <rect x="5" y="1" width="18" height="4" rx="2" fill="#2563EB"/>
  <rect x="8" y="10" width="18" height="4" rx="2" fill="#2563EB"/>
  <rect x="2" y="19" width="18" height="4" rx="2" fill="#2563EB"/>
</svg>
    <span>AR&nbsp;24</span>
  </a>
  <span class="topbar-note">Espace sécurisé — site officiel</span>
</header>
{% block body %}{% endblock %}
<footer class="foot" data-testid="site-footer">
  <span>© 2026 AR24 — Tous droits réservés</span>
  <nav class="foot-links">
    <a href="#" data-testid="footer-legal-link">Mentions légales</a>
    <a href="mailto:contact@aicha-s.fr" data-testid="footer-contact-link">Contact</a>
    <span class="foot-tag">Données hébergées en France</span>
  </nav>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
